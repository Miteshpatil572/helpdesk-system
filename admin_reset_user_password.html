<!DOCTYPE html>
<html>
<head>
    <title>Reset User Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="sidebar">

    <h2>Admin Panel</h2>

    <a href="/dashboard">Dashboard</a>
    <a href="/tickets">Manage Tickets</a>
    <a href="/analytics">Analytics</a>
    <a href="/admin">Admin Panel</a>
    <a href="/profile">Profile</a>
    <a href="/logout">Logout</a>

</div>

<div class="main">

    <div class="topbar">
        <h2>Reset Password for {{ user[1] }}</h2>
    </div>

    <div class="table-box">

        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}

        <p><strong>User:</strong> {{ user[1] }} &nbsp; | &nbsp; <strong>Email:</strong> {{ user[2] }}</p>

        <form action="/admin/reset_user_password/{{ user[0] }}" method="POST">
            <label>New Password</label>
            <input type="password" name="password" required>

            <button type="submit">Update Password</button>
        </form>

        <p>
            <a href="/admin/users">Back to User List</a>
        </p>

    </div>

</div>

</body>
</html>
