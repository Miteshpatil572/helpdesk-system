<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Help Desk System

    </title>

    <!-- CSS -->

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <!-- CHART JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>

        Help Desk

    </h2>

    <a href="/dashboard">

        Dashboard

    </a>

    <a href="/analytics">

        Analytics

    </a>

    <a href="/tickets">

        Tickets

    </a>

    <a href="/create_ticket">

        Create Ticket

    </a>

    {% if session['role'] == 'admin' %}

    <a href="/admin">

        Admin Panel

    </a>

    {% endif %}

    <a href="/profile">

        Profile

    </a>

    <a href="/logout">

        Logout

    </a>

</div>

<!-- MAIN -->

<div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

        <h2>

            {% block title %}

            {% endblock %}

        </h2>

    </div>

    <!-- CONTENT -->

    {% block content %}

    {% endblock %}

</div>

</body>

</html>
